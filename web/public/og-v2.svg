<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">zkdeal - one workflow, one proof-backed outcome</title>
  <desc id="desc">A bounded execution room turns authenticated Ethereum state and ordered actions into one verified checkpoint.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f1f0ff"/>
    </linearGradient>
    <linearGradient id="bluePurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1768ff"/>
      <stop offset="1" stop-color="#7556f5"/>
    </linearGradient>
    <linearGradient id="roomFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f7ff"/>
      <stop offset="1" stop-color="#f6f2ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20c878"/>
      <stop offset="1" stop-color="#079653"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17315f" flood-opacity="0.12"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17315f" flood-opacity="0.14"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#9ab8ef" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <path d="M0 494C142 444 221 555 366 510C464 480 525 418 616 430V630H0Z" fill="#edf4ff" opacity="0.76"/>
  <path d="M0 535C143 482 240 592 391 548C482 521 546 473 632 484" fill="none" stroke="#c8daf9" stroke-width="2" opacity="0.62"/>
  <path d="M0 565C145 514 253 617 405 579C497 556 552 516 643 521" fill="none" stroke="#d9cfff" stroke-width="2" opacity="0.58"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="68" y="83" fill="#071a3c" font-size="48" font-weight="700" letter-spacing="-2">zkdeal</text>
    <rect x="68" y="111" width="322" height="36" rx="18" fill="#eaf2ff" stroke="#c7dbff"/>
    <circle cx="90" cy="129" r="6" fill="#1768ff"/>
    <text x="106" y="135" fill="#184170" font-size="16" font-weight="700" letter-spacing="1.05">PROOF-BACKED ROOMS FOR ETHEREUM</text>

    <text x="68" y="228" fill="#071a3c" font-size="58" font-weight="760" letter-spacing="-2.1">One workflow.</text>
    <text x="68" y="296" fill="#1768ff" font-size="58" font-weight="760" letter-spacing="-2.1">One provable</text>
    <text x="68" y="364" fill="#7556f5" font-size="58" font-weight="760" letter-spacing="-2.1">outcome.</text>

    <text x="70" y="421" fill="#334c70" font-size="23" font-weight="500">Run a bounded, multi-step workflow.</text>
    <text x="70" y="455" fill="#334c70" font-size="23" font-weight="500">Checkpoint the verified result to Ethereum.</text>

    <g transform="translate(68 512)">
      <rect width="492" height="58" rx="18" fill="#ffffff" stroke="#dbe6f7" filter="url(#smallShadow)"/>
      <circle cx="32" cy="29" r="16" fill="url(#green)"/>
      <path d="M24 29l6 6 11-13" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="61" y="25" fill="#071a3c" font-size="15" font-weight="700" letter-spacing="0.9">ENTER  ·  ACT  ·  PROVE  ·  SETTLE  ·  CLOSE</text>
      <text x="61" y="44" fill="#617390" font-size="14" font-weight="500">zkdeal.org</text>
    </g>
  </g>

  <g transform="translate(624 65)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="516" height="500" rx="34" fill="#ffffff" stroke="#c9dafe" stroke-width="2" filter="url(#shadow)"/>
    <rect x="22" y="22" width="472" height="456" rx="25" fill="url(#roomFill)"/>
    <rect x="22" y="22" width="472" height="456" rx="25" fill="url(#dots)" opacity="0.36"/>

    <rect x="48" y="47" width="244" height="34" rx="17" fill="#e5edff"/>
    <circle cx="69" cy="64" r="5" fill="#7556f5"/>
    <text x="83" y="70" fill="#263f72" font-size="14" font-weight="750" letter-spacing="1">BOUNDED EXECUTION ROOM</text>
    <rect x="366" y="47" width="102" height="34" rx="17" fill="#ffffff" stroke="#d3def2"/>
    <text x="417" y="69" text-anchor="middle" fill="#536987" font-size="13" font-weight="700">SHORT-LIVED</text>

    <line x1="82" y1="139" x2="434" y2="139" stroke="#bbcbeb" stroke-width="4" stroke-linecap="round"/>
    <line x1="82" y1="139" x2="434" y2="139" stroke="url(#bluePurple)" stroke-width="4" stroke-linecap="round" stroke-dasharray="88 15"/>

    <g text-anchor="middle" font-weight="750">
      <g transform="translate(82 139)">
        <circle r="25" fill="#ffffff" stroke="#1768ff" stroke-width="4" filter="url(#smallShadow)"/>
        <text y="7" fill="#1768ff" font-size="20">1</text>
        <text y="50" fill="#516783" font-size="13" letter-spacing="0.8">PREPARE</text>
      </g>
      <g transform="translate(200 139)">
        <circle r="25" fill="#ffffff" stroke="#3873f6" stroke-width="4" filter="url(#smallShadow)"/>
        <text y="7" fill="#3873f6" font-size="20">2</text>
        <text y="50" fill="#516783" font-size="13" letter-spacing="0.8">ACT</text>
      </g>
      <g transform="translate(318 139)">
        <circle r="25" fill="#ffffff" stroke="#5a61f5" stroke-width="4" filter="url(#smallShadow)"/>
        <text y="7" fill="#5a61f5" font-size="20">3</text>
        <text y="50" fill="#516783" font-size="13" letter-spacing="0.8">PROVE</text>
      </g>
      <g transform="translate(434 139)">
        <circle r="25" fill="#ffffff" stroke="#7556f5" stroke-width="4" filter="url(#smallShadow)"/>
        <text y="7" fill="#7556f5" font-size="20">4</text>
        <text y="50" fill="#516783" font-size="13" letter-spacing="0.8">SETTLE</text>
      </g>
    </g>

    <g transform="translate(48 232)">
      <rect width="120" height="126" rx="18" fill="#ffffff" stroke="#cbdaf2"/>
      <rect x="20" y="19" width="80" height="32" rx="10" fill="#edf4ff"/>
      <path d="M34 35h52M42 27v16M52 27v16M62 27v16M72 27v16" stroke="#1768ff" stroke-width="3" stroke-linecap="round"/>
      <text x="60" y="79" text-anchor="middle" fill="#071a3c" font-size="14" font-weight="750">AUTHENTICATED</text>
      <text x="60" y="99" text-anchor="middle" fill="#071a3c" font-size="14" font-weight="750">STATE</text>
    </g>

    <path d="M179 295h29" stroke="#7394ce" stroke-width="3" stroke-linecap="round"/>
    <path d="M201 286l10 9-10 9" fill="none" stroke="#7394ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(219 212)">
      <rect width="158" height="166" rx="22" fill="#ffffff" stroke="#8faef0" stroke-width="2" filter="url(#smallShadow)"/>
      <rect x="20" y="20" width="118" height="44" rx="13" fill="url(#bluePurple)"/>
      <circle cx="43" cy="42" r="8" fill="#ffffff" opacity="0.92"/>
      <circle cx="64" cy="42" r="8" fill="#ffffff" opacity="0.76"/>
      <circle cx="85" cy="42" r="8" fill="#ffffff" opacity="0.6"/>
      <path d="M42 91h75M42 110h75M42 129h52" stroke="#b5c5e2" stroke-width="8" stroke-linecap="round"/>
      <text x="79" y="154" text-anchor="middle" fill="#435b7e" font-size="13" font-weight="750">ORDERED BLOCKS</text>
    </g>

    <path d="M388 295h28" stroke="#7394ce" stroke-width="3" stroke-linecap="round"/>
    <path d="M409 286l10 9-10 9" fill="none" stroke="#7394ce" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(428 232)">
      <circle cx="35" cy="63" r="35" fill="url(#green)" filter="url(#smallShadow)"/>
      <path d="M19 63l11 11 22-27" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="35" y="119" text-anchor="middle" fill="#275276" font-size="13" font-weight="750">L1 EXIT</text>
    </g>

    <g transform="translate(48 406)">
      <rect width="420" height="48" rx="16" fill="#e7f8ef" stroke="#a9e2c4"/>
      <circle cx="26" cy="24" r="8" fill="#0ca861"/>
      <text x="47" y="30" fill="#176341" font-size="16" font-weight="750" letter-spacing="0.45">ONE PROOF  ·  ONE VERIFIED CHECKPOINT</text>
    </g>
  </g>
</svg>
